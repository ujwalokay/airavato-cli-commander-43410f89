services:
  - type: web
    name: airavoto-head
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: NITRO_PRESET
        value: node-server
      # Temporary authentication bridge; all platform and POS records use Render PostgreSQL.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: airavoto-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: AUTH_SECRET
        generateValue: true

databases:
  - name: airavoto-db
    plan: free
    databaseName: airavoto
    user: airavoto
